</style><header><span class="brand">⚑ SQUADRIGLIE</span></header><main class="shell login"><section class="panel"><div class="eyebrow">UNO SPAZIO PER OGNI REPARTO</div><h1>Accesso amministratore</h1><p>Al primo avvio usa le credenziali iniziali e scegli subito una nuova password.</p><form id="login"><label for="name">Nome utente</label><input id="name" name="username" autocomplete="username" maxlength="100" value="admin" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><p id="error" class="error" role="alert"></p><button class="primary" style="width:100%" id="submit">Accedi</button></form><p class="hint" style="margin-top:24px"><a href="/">Accesso reparti →</a></p></section></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),error=document.getElementById('error');b.disabled=true;error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'admin',name:document.getElementById('name').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Accesso non riuscito');location.href=d.mustChange?'/account/password':'/'}catch(err){error.textContent=err.message}finally{b.disabled=false}};</script></html>
